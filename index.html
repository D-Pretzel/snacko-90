<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>J-Flight Snacko Store</title>

<!-- Both are the J Flight patch. favicon-64 is cropped tighter so it still
     reads at the 16px a browser tab actually draws. -->
<link rel="icon" href="favicon-64.png" />
<link rel="apple-touch-icon" href="icon-192.png" />

<!-- ============================================================= -->
<!--  The menu lives in menu.json, not in this file.                -->
<!--  Edit it from admin.html, or edit menu.json directly on GitHub. -->
<!-- ============================================================= -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg:     #F3EFE5;
    --panel:  #FBF8F0;
    --ink:    #1A1C22;
    --muted:  #6B6456;         /* 5.1:1 on --bg; was 4.1:1 */
    --rule:   #CFC8B7;
    --rule-2: #E6E1D2;
    --accent: #D96B4A;         /* warm coral - used for pay + minus hover */
    --accent-press: #B7532F;
    /* --accent is a fill color; as small text it only reaches 3.2:1. This is
       the same hue taken down to clear 4.5:1 on the cards. */
    --accent-ink: #A8432A;
    --blue: #3A7BD5;           /* selection blue - active row + plus hover */
    --blue-tint: #E4EEFB;
    /* Search-hit highlight. Deliberately not --blue-tint: that is tuned to sit
       against --bg for the selected-row fill, and a <mark> sits against
       --panel, where it needs more separation to read. */
    --hit: #CFE0F7;
    /* Each pay button wears the color of that brand's own checkout button, so
       the two read as separate choices rather than one blue slab. Venmo's
       azure is taken down a step from its #008CFF brand blue: the brand value
       only reaches 3.4:1 against white label text, and this clears 4.5:1. */
    --venmo: #0073D6;
    --venmo-press: #005DB0;
    --good: #2E7D5B;
    --shadow: 0 1px 2px rgba(20,22,26,.04), 0 6px 18px rgba(20,22,26,.05);
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:     #14161A;
      --panel:  #1D2026;
      --ink:    #EFE9DA;
      --muted:  #9A9382;
      --accent-ink: #E8866A;
      --rule:   #3B3E46;
      --rule-2: #292C33;
      --blue-tint: #172436;
      --hit: #2C4A6B;
      --good: #6BC49B;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.35;
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }

  /* The bottom padding is a starting guess only - the script measures the bar
     and overwrites it, because a fixed number cannot know how tall the bar
     actually is and the last rows end up unreachable behind it when it grows. */
  .wrap { max-width: 520px; margin: 0 auto; padding: 22px 18px 180px; }

  /* Header */
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 4px 4px 20px;
    margin-bottom: 14px;
    border-bottom: 1px solid var(--rule);
  }
  .mark { width: 56px; height: 56px; object-fit: contain; flex: 0 0 56px; }
  h1 {
    font-size: 26px; font-weight: 700; letter-spacing: -.015em;
    margin: 0; line-height: 1;
  }

  /* Search */
  .search {
    display: flex; align-items: center; gap: 8px;
    padding: 0 12px;
    margin-bottom: 12px;
    background: var(--panel);
    border: 1px solid var(--rule-2);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    transition: border-color .18s ease;
  }
  .search:focus-within { border-color: var(--blue); }
  .search[hidden] { display: none; }

  .search-icon { flex: 0 0 auto; width: 16px; height: 16px; color: var(--muted); }

  #searchInput {
    flex: 1 1 auto; min-width: 0;
    border: none; outline: none; background: transparent;
    color: var(--ink);
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    /* 16px is the floor: below it, iOS Safari zooms the page on focus and the
       customer is left pinched in on a menu they then have to scroll sideways. */
    font-size: 16px;
    padding: 13px 0;
  }
  #searchInput::placeholder { color: var(--muted); }
  /* Replaced by .search-clear, so the control matches the rest of the page. */
  #searchInput::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }

  .search-clear {
    flex: 0 0 auto;
    width: 34px; height: 34px; border-radius: 9px;
    border: none; background: transparent; color: var(--muted);
    font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .search-clear:hover { background: var(--bg); color: var(--ink); }
  .search-clear:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .search-clear[hidden] { display: none; }

  .search-status {
    margin: -2px 0 12px;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted);
  }
  /* Collapses the gap when there is nothing to say, without leaving the live
     region display:none - screen readers announce changes less reliably then. */
  .search-status:empty { margin: 0; }

  /* Present to assistive tech, absent from the layout. */
  .sr-only {
    position: absolute; width: 1px; height: 1px;
    margin: -1px; padding: 0; border: 0;
    clip-path: inset(50%); overflow: hidden; white-space: nowrap;
  }

  /* Names are normally clipped to one line with an ellipsis, which can hide the
     very run that matched - "Propel Electrolyte Drink Powder Stick" searched
     for "powder" would otherwise show no highlight at all. While filtering,
     let them wrap. */
  #menu.searching .name-lead { overflow: visible; }
  #menu.searching .name {
    white-space: normal;
    overflow: visible;
    text-overflow: clip;
    flex: 1 1 auto;      /* the full row, rather than sharing it with the leader */
  }
  /* The dotted leader is decoration, and squeezing a wrapping name against it
     stacks the words into a narrow column. It comes back when the search clears. */
  #menu.searching .lead { display: none; }

  mark {
    background: var(--hit);
    color: inherit;   /* never the UA's black-on-yellow, which fights dark mode */
    border-radius: 3px;
    padding: 0 1px;
  }

  /* Category sections. Spaced with a flex gap rather than `.cat + .cat`, which
     keys off DOM order and so leaves a phantom 22px above the first result
     when the sections before it are filtered out. Gaps ignore hidden children. */
  #menu { display: flex; flex-direction: column; gap: 22px; }
  .cat-head {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 4px 8px;
  }
  .cat-title {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 12px; font-weight: 500;
    letter-spacing: .18em; text-transform: uppercase;
    color: var(--muted);
  }
  .cat-rule { flex: 1 1 auto; height: 1px; background: var(--rule-2); }

  /* Item rows - soft cards with ledger interior */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .item {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto auto;
    align-items: center;
    gap: 10px;
    padding: 12px 12px 12px 14px;
    background: var(--panel);
    border: 1px solid var(--rule-2);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    transition: border-color .18s ease, background .18s ease;
    /* The browser scrolls a focused row to the viewport edge, which is behind
       the fixed bar. --bar-h is kept current by the script. */
    scroll-margin-bottom: calc(var(--bar-h, 180px) + 12px);
  }
  .item.active {
    border-color: var(--blue);
    background: var(--blue-tint);
  }
  /* Author `display: grid` above beats the UA sheet's `[hidden] { display: none }`
     no matter the specificity, so filtered-out rows need this to actually go
     away. Same reason `.search` and `.pay` each carry one. */
  .item[hidden] { display: none; }

  .name-lead {
    display: flex; align-items: baseline; gap: 8px;
    min-width: 0; overflow: hidden;
  }
  /* Wraps rather than truncating. With the 44px stepper and a sale price
     beside it, a phone leaves room for about eight characters, and "Ready…"
     does not tell anyone which bar they are buying. */
  .name {
    font-size: 15.5px; font-weight: 550;
    overflow-wrap: break-word;
    flex: 0 1 auto;
  }
  /* min-width 0: a long name takes the whole line and the leader gives way,
     instead of the leader holding space open and squeezing the name. */
  .lead {
    flex: 1 1 auto; height: 1px; min-width: 0;
    background-image: radial-gradient(circle, var(--rule) 1px, transparent 1.2px);
    background-size: 6px 2px; background-repeat: repeat-x;
    background-position: left center;
    transform: translateY(-3px);
  }
  .price {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 14px; font-weight: 500;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }

  /* Description - muted second line under the name */
  .name-block { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .desc {
    font-size: 13px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis;
  }

  /* Sale pricing - stacked so the tag never steals width from the item name */
  .price-block { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
  /* Stacked, sale price on top: side by side the two prices took as much
     width as the item name had left. */
  .price-line { display: flex; flex-direction: column-reverse; align-items: flex-end; gap: 1px; }
  .price.was {
    color: var(--muted);
    text-decoration: line-through;
    font-size: 12.5px;
  }
  .sale-tag {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 11px; font-weight: 500; letter-spacing: .08em;
    color: var(--accent-ink);
    white-space: nowrap;
  }

  /* Stepper - friendlier rounded, but still POS-clean */
  .qty { display: flex; align-items: center; gap: 4px; }
  /* 44px is the minimum comfortable tap target; this is the control people
     hit most on the page, usually one-handed. */
  .qty button {
    width: 44px; height: 44px; border-radius: 11px;
    touch-action: manipulation;   /* no double-tap zoom eating a second tap */
    border: 1px solid var(--rule); background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 18px; font-weight: 500;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0;
    transition: background .15s ease, opacity .15s ease, border-color .15s ease, transform .1s ease;
  }
  .qty button:hover { background: var(--panel); }
  .qty button:active { transform: scale(.94); }
  .qty .plus:hover  { border-color: var(--blue); }
  .qty .minus:hover { border-color: var(--accent); }
  .qty .plus:focus-visible  { outline: 2px solid var(--blue);   outline-offset: 2px; }
  .qty .minus:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .qty .minus[disabled] {
    opacity: .35; pointer-events: none; border-color: var(--rule-2);
  }
  .qty .q-num {
    min-width: 22px; text-align: center;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 14px; font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  /* Loading + error states */
  .state {
    padding: 28px 18px; text-align: center;
    background: var(--panel);
    border: 1px solid var(--rule-2);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .state p { margin: 0 0 4px; }
  .state .hint { font-size: 13px; color: var(--muted); }
  .retry {
    margin-top: 16px;
    padding: 11px 20px; border-radius: 10px;
    border: 1px solid var(--rule); background: var(--bg); color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif; font-size: 15px; font-weight: 500;
    cursor: pointer;
  }
  .retry:hover { border-color: var(--accent); }
  .retry:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Sticky totals bar.

     This covers the menu on a phone, so it is kept as short as it can be
     without shrinking anything you have to read or hit. Most of the saving
     comes from setting the two pay buttons side by side instead of stacking
     them: that is one button height and one gap removed. The rest is the
     item count and the total sharing one line rather than two. */
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    /* env() is 0 on anything without a home indicator, so the bottom value has
       to stand on its own there rather than relying on the inset. */
    padding: 10px 18px calc(12px + env(safe-area-inset-bottom));
    background: var(--bg);
    border-top: 1px solid var(--rule);
  }
  .bar .inner { max-width: 520px; margin: 0 auto; }
  /* Set while the on-screen keyboard is up. visibility, not display, so the
     bar keeps its box and the measured clearance below stays correct. */
  .bar.kb-hidden { visibility: hidden; }

  /* Count and total on one line. The dashed rule stays - it is the ledger
     language the rest of the page is built on. */
  .totals {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 12px;
    padding-bottom: 8px; margin-bottom: 10px;
    border-bottom: 1px dashed var(--rule);
  }
  .totals .items {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .totals .grand {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 23px; font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }

  /* Venmo is the main button: it is the only method whose link carries both
     the amount and the itemized note. Any other method with a username set
     sits in a row of smaller, equal buttons underneath. With only Venmo set,
     the bar is a single button, as it always was. */
  .pay-alt { display: flex; gap: 8px; margin-top: 8px; }
  .pay-alt:empty, .pay-alt[hidden] { display: none; }
  /* No Venmo at all: the row becomes the main row, so its buttons take the
     main button's height and fill. */
  .pay-alt.only { margin-top: 0; }

  .pay {
    flex: 1 1 0; min-width: 0;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    /* 52px clears the 44px minimum tap target with room to spare. */
    min-height: 52px;
    padding: 14px 16px;
    border: none; border-radius: 14px;
    background: var(--venmo); color: #fff;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 16px; font-weight: 600;
    letter-spacing: .03em;
    white-space: nowrap;
    text-decoration: none; cursor: pointer;
    touch-action: manipulation;
    transition: background .18s ease, color .18s ease, border-color .18s ease;
  }
  .pay:hover { background: var(--venmo-press); }
  .pay[hidden] { display: none; }
  /* One ring for every button, in the page's own ink: it reads against cream,
     against the dark bar, and against any fill. */
  .pay:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* Secondary methods are neutral rather than wearing three more brand colors:
     four saturated slabs in a strip this size read as noise, and none of these
     can do what the Venmo button does, so none should look like it can. */
  .pay.sec {
    min-height: 46px; padding: 10px 8px;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--rule);
    font-size: 15px; letter-spacing: 0;
  }
  .pay.sec:hover { background: var(--panel); border-color: var(--ink); }
  .pay-alt.only .pay.sec {
    min-height: 52px; background: var(--ink); color: var(--bg); border-color: var(--ink);
    font-size: 16px;
  }

  /* An empty cart is not a moment to choose, so disabled drops every fill.
     Must stay below the rules above: same specificity, and the gray has to win. */
  .pay.disabled, .pay.sec.disabled, .pay-alt.only .pay.sec.disabled {
    background: var(--rule); color: var(--muted); border-color: var(--rule); pointer-events: none;
  }

  .venmo-logo {
    width: 24px; height: 24px; flex: 0 0 24px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 7px;
    /* The Venmo mark is a blue tile with a white V, so it needs a white chip
       to hold it off the blue button underneath. */
    background: #fff; padding: 2px;
  }
  .venmo-logo img { width: 100%; height: 100%; display: block; }
  .pay.disabled .venmo-logo { opacity: .5; }

  /* ---------------- payment hand-off sheet ------------------------------
     PayPal, Cash App and Zelle cannot take the itemized note through a link
     (and Zelle has no link at all), so their buttons open this instead: the
     note is already on the clipboard, and everything needed to finish the
     payment is on screen with its own Copy button. A native <dialog> gives
     the focus trap, Esc to close and the inert background for free. */
  .sheet {
    width: 100%; max-width: 520px;
    margin: auto auto 0;            /* pinned to the bottom, like the bar */
    padding: 20px 18px calc(18px + env(safe-area-inset-bottom));
    border: 1px solid var(--rule); border-bottom: none;
    border-radius: 18px 18px 0 0;
    background: var(--panel); color: var(--ink);
    box-shadow: 0 -8px 30px rgba(0,0,0,.18);
  }
  .sheet::backdrop { background: rgba(10,12,16,.5); }
  .sheet h2 { margin: 0 0 14px; font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
  .sheet dl { margin: 0; }
  .srow {
    display: grid; grid-template-columns: 76px minmax(0, 1fr) auto;
    align-items: center; gap: 10px;
    padding: 10px 0; border-top: 1px solid var(--rule-2);
  }
  .srow:last-child { border-bottom: 1px solid var(--rule-2); }
  .srow[hidden] { display: none; }
  .srow dt {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--muted);
  }
  .srow dd { margin: 0; min-width: 0; overflow-wrap: anywhere; font-size: 15px; }
  .srow .amt { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 18px; font-weight: 600; }
  .srow .note { font-size: 14px; line-height: 1.4; }
  .copy {
    min-width: 72px; min-height: 44px; padding: 0 12px;
    border: 1px solid var(--rule); border-radius: 10px;
    background: var(--bg); color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; font-weight: 500;
    cursor: pointer; touch-action: manipulation;
  }
  .copy.done { border-color: var(--good); color: var(--good); }
  .copy:focus-visible, .sheet-actions > *:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .sheet-help { margin: 14px 0 0; font-size: 14px; line-height: 1.45; color: var(--muted); }
  .sheet-actions { display: flex; gap: 10px; margin-top: 16px; }
  .sheet-actions > * {
    flex: 1 1 0; min-height: 50px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 12px; font-family: 'IBM Plex Sans', sans-serif;
    font-size: 16px; font-weight: 600; text-decoration: none; cursor: pointer;
  }
  .sheet-close { border: 1px solid var(--rule); background: var(--bg); color: var(--ink); }
  .sheet-go { border: none; background: var(--ink); color: var(--bg); }
  .sheet-go[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <img class="mark" src="jflight-logo.png" alt="J Flight &quot;Welcome to the Jungle&quot; patch" />
      <h1>J-Flight Snacko Store</h1>
    </header>

    <!-- Deliberately not sticky. The pay bar already takes fixed space at the
         bottom; a second fixed strip would take back what that one gave up.
         Hidden entirely on a short menu, where scrolling beats typing. -->
    <div class="search" id="searchWrap" hidden>
      <!-- Inline rather than a glyph: U+2315 and friends are missing from
           enough phone fonts to show up as a blank or a tofu box. -->
      <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true"
           fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="6.8" cy="6.8" r="4.3" />
        <path d="M10 10 L14 14" stroke-linecap="round" />
      </svg>
      <input type="search" id="searchInput" placeholder="Search items"
             aria-label="Search the menu by item name"
             autocomplete="off" autocorrect="off" autocapitalize="off"
             spellcheck="false" enterkeyhint="search" />
      <button type="button" class="search-clear" id="searchClear" aria-label="Clear search" hidden>✕</button>
    </div>
    <!-- Two elements on purpose: the visible count updates on every keystroke,
         while the announced one is debounced, so a screen reader gets one
         result count per pause instead of one per character typed. -->
    <p class="search-status" id="searchStatus" aria-hidden="true"></p>
    <p class="sr-only" id="searchAnnounce" role="status"></p>

    <div id="menu">
      <div class="state"><p>Loading menu…</p></div>
    </div>

    <div class="state" id="noResults" hidden>
      <p>No items match <span id="noResultsQuery"></span>.</p>
      <p class="hint">Try a shorter word, or clear the search.</p>
    </div>
  </div>

  <div class="bar">
    <div class="inner">
      <div class="totals">
        <span class="items"><span id="count">0</span> <span id="countLabel">items</span></span>
        <span class="grand" id="total">$0.00</span>
      </div>
      <!-- The visible labels are just the brand, since the total sits directly
           above. aria-label keeps the full phrase for screen readers. -->
      <a class="pay disabled" id="payBtn" href="#" aria-label="Pay with Venmo" hidden>
        <span class="venmo-logo" aria-hidden="true">
          <img src="venmo-logo.png" alt="" />
        </span>
        <span>Venmo</span>
      </a>
      <div class="pay-alt" id="altRow">
        <button type="button" class="pay sec disabled" data-method="paypal" aria-label="Pay with PayPal" hidden>PayPal</button>
        <button type="button" class="pay sec disabled" data-method="cashapp" aria-label="Pay with Cash App" hidden>Cash App</button>
        <button type="button" class="pay sec disabled" data-method="zelle" aria-label="Pay with Zelle" hidden>Zelle</button>
      </div>
    </div>
  </div>

  <dialog class="sheet" id="paySheet" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">Pay</h2>
    <dl>
      <div class="srow">
        <dt>Send to</dt><dd id="sheetTo"></dd>
        <button type="button" class="copy" data-copy="to">Copy</button>
      </div>
      <div class="srow">
        <dt>Amount</dt><dd class="amt" id="sheetAmt"></dd>
        <button type="button" class="copy" data-copy="amt">Copy</button>
      </div>
      <div class="srow">
        <dt>Note</dt><dd class="note" id="sheetNote"></dd>
        <button type="button" class="copy" data-copy="note">Copy</button>
      </div>
    </dl>
    <p class="sheet-help" id="sheetHelp"></p>
    <div class="sheet-actions">
      <button type="button" class="sheet-close" id="sheetClose">Close</button>
      <a class="sheet-go" id="sheetGo" href="#" rel="noopener">Open</a>
    </div>
  </dialog>

<script>
  const money = n => "$" + n.toFixed(2);

  /* Today as YYYY-MM-DD in local time, so a sale ending "today" is still on. */
  function todayLocalISO() {
    const d = new Date();
    const pad = n => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  }

  /* An expired sale is ignored, not removed from the file. */
  function activeSale(item) {
    const s = item.sale;
    if (!s || typeof s.percentOff !== "number") return null;
    if (!(s.percentOff >= 1 && s.percentOff <= 99)) return null;
    if (s.until && String(s.until) < todayLocalISO()) return null;
    return s;
  }

  function effectivePrice(item) {
    const s = activeSale(item);
    if (!s) return item.price;
    return Math.round(item.price * (1 - s.percentOff / 100) * 100) / 100;
  }

  const menuEl  = document.getElementById("menu");
  const totalEl = document.getElementById("total");
  const countEl = document.getElementById("count");
  const countLabelEl = document.getElementById("countLabel");
  const payBtn  = document.getElementById("payBtn");
  const altRow  = document.getElementById("altRow");
  const altBtns = {};
  altRow.querySelectorAll("[data-method]").forEach(b => { altBtns[b.dataset.method] = b; });

  const searchWrap   = document.getElementById("searchWrap");
  const searchInput  = document.getElementById("searchInput");
  const searchClear  = document.getElementById("searchClear");
  const searchStatus = document.getElementById("searchStatus");
  const searchAnnounce = document.getElementById("searchAnnounce");
  const noResults    = document.getElementById("noResults");
  const noResultsQ   = document.getElementById("noResultsQuery");

  /* Below this, scrolling the list is quicker than reaching for the keyboard,
     and the field is just clutter. The menu is snacko-editable, so this is
     re-evaluated on every render rather than decided once. */
  const SEARCH_MIN_ITEMS = 10;

  let state = [];

  /* Where each method sends money, straight from menu.json. Empty means the
     stand does not take that method and its button is never drawn. All four
     are set from admin.html, so a change of snacko needs no code change. */
  let venmoUsername = "";
  let paypalHandle = "";   /* the bit after paypal.me/ */
  let cashtag = "";        /* without the $ */
  let zelleTo = "";        /* email or phone number */
  let standName = "";

  /* The Venmo app's own link for the current cart, kept alongside payBtn.href
     rather than in it - see the click handler below for why the button still
     points at the web link. Empty until there is something to pay for. */
  let venmoAppHref = "";

  /* Only phones have an app to hand off to, so only phones take the app-first
     path. A user-agent test is crude, but the cost of being wrong either way is
     just the web link, which works everywhere. */
  const isPhone = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  /* One record per rendered row: { row, section, nameEl, original, folded, map }.
     Rebuilt by render(), read by applyFilter(). Filtering only toggles `hidden`
     on rows that already exist - it never re-renders, because quantities live
     in a closure created by itemRow() and re-rendering would silently reset
     every one of them mid-shop. */
  let searchIndex = [];

  function el(tag, className, text) {
    const n = document.createElement(tag);
    if (className) n.className = className;
    if (text !== undefined) n.textContent = text;
    return n;
  }

  function showState(message, hint, withRetry) {
    state = [];
    searchIndex = [];
    searchWrap.hidden = true;
    searchInput.value = "";
    searchClear.hidden = true;
    searchStatus.textContent = "";
    searchAnnounce.textContent = "";
    noResults.hidden = true;
    updateTotals();
    menuEl.replaceChildren();
    const box = el("div", "state");
    box.appendChild(el("p", null, message));
    if (hint) box.appendChild(el("p", "hint", hint));
    if (withRetry) {
      const btn = el("button", "retry", "Try again");
      btn.addEventListener("click", load);
      box.appendChild(btn);
    }
    menuEl.appendChild(box);
  }

  function render(menu) {
    state = [];
    searchIndex = [];
    menuEl.replaceChildren();
    document.title = menu.name || "J-Flight Snacko Store";
    const h1 = document.querySelector("h1");
    if (menu.name) h1.textContent = menu.name;
    venmoUsername = (menu.venmoUsername || "").trim();
    paypalHandle = (menu.paypalHandle || "").trim();
    cashtag = (menu.cashtag || "").trim();
    zelleTo = (menu.zelleRecipient || "").trim();
    standName = menu.name || "";

    let anyVisible = false;

    (menu.categories || []).forEach(cat => {
      const items = (cat.items || []).filter(it => it && !it.hidden);
      if (items.length === 0) return;   // skip empty categories
      anyVisible = true;

      const section = el("section", "cat");
      const head = el("div", "cat-head");
      head.appendChild(el("span", "cat-title", cat.label || ""));
      const rule = el("span", "cat-rule");
      rule.setAttribute("aria-hidden", "true");
      head.appendChild(rule);
      section.appendChild(head);

      const list = el("div", "list");
      items.forEach(raw => {
        /* Editing menu.json by hand on GitHub is a documented fallback, so one
           typo there must cost one row, not the whole storefront. A missing or
           non-string name used to reach foldWithMap() and throw "s is not
           iterable" straight out of render(), leaving the customer an empty
           page and a misleading connection error. Price is coerced for the
           same reason - a quoted "1.50" would otherwise throw on toFixed. */
        const item = (typeof raw.name === "string" && Number.isFinite(raw.price))
          ? raw
          : Object.assign({}, raw, {
              name: typeof raw.name === "string" ? raw.name : "",
              price: Number.isFinite(raw.price) ? raw.price : Number(raw.price) || 0,
            });

        const entry = { name: item.name, price: effectivePrice(item), qty: 0 };
        state.push(entry);
        const row = itemRow(item, entry);
        /* Folded once here, so a keystroke costs only indexOf over these. */
        const folded = foldWithMap(item.name);
        const bounds = clusterBounds(item.name);
        searchIndex.push({
          row, section,
          nameEl: row.querySelector(".name"),
          original: item.name,
          folded: folded.text,
          map: folded.map,
          startOf: bounds.startOf,
          endOf: bounds.endOf,
        });
        list.appendChild(row);
      });
      section.appendChild(list);
      menuEl.appendChild(section);
    });

    if (!anyVisible) {
      showState("Nothing for sale right now.", "Check back soon.", false);
      return;
    }

    searchWrap.hidden = searchIndex.length < SEARCH_MIN_ITEMS;
    if (searchWrap.hidden) searchInput.value = "";
    /* Establishes the initial state of the field, the clear button and the
       status line. It is not carrying a query across a reload: load() calls
       showState() first, which empties the field. */
    applyFilter();
    updateTotals();
  }

  function itemRow(item, entry) {
    const row = el("div", "item");

    /* Name (+ optional description) */
    const nameBlock = el("div", "name-block");
    const nameLead = el("span", "name-lead");
    nameLead.appendChild(el("span", "name", item.name));
    const lead = el("span", "lead");
    lead.setAttribute("aria-hidden", "true");
    nameLead.appendChild(lead);
    nameBlock.appendChild(nameLead);
    if (item.description && String(item.description).trim() !== "") {
      nameBlock.appendChild(el("span", "desc", item.description));
    }
    row.appendChild(nameBlock);

    /* Price, with sale treatment when one is running */
    const sale = activeSale(item);
    const priceBlock = el("div", "price-block");
    if (sale) {
      priceBlock.appendChild(el("span", "sale-tag", sale.percentOff + "% OFF"));
      const line = el("span", "price-line");
      line.appendChild(el("span", "price was", money(item.price)));
      line.appendChild(el("span", "price", money(entry.price)));
      priceBlock.appendChild(line);
    } else {
      priceBlock.appendChild(el("span", "price", money(entry.price)));
    }
    row.appendChild(priceBlock);

    /* Stepper */
    const qty = el("div", "qty");
    const minus = el("button", "minus", "−");
    minus.setAttribute("aria-label", "Remove one " + item.name);
    minus.disabled = true;
    const num = el("span", "q-num", "0");
    const plus = el("button", "plus", "+");
    plus.setAttribute("aria-label", "Add one " + item.name);
    qty.append(minus, num, plus);
    row.appendChild(qty);

    const sync = () => {
      num.textContent = entry.qty;
      row.classList.toggle("active", entry.qty > 0);
      minus.disabled = entry.qty === 0;
      updateTotals();
    };
    plus.addEventListener("click", () => { entry.qty++; sync(); });
    minus.addEventListener("click", () => { if (entry.qty > 0) entry.qty--; sync(); });

    return row;
  }

  /* ---------------- search ------------------------------------------

     Filtering hides rows, it does not rebuild them. Quantities therefore
     survive every keystroke, and an item hidden by the search still counts
     toward the total and the Venmo note - the totals bar stays the single
     source of truth for what is being bought. Clearing the search brings
     everything back untouched.                                          */

  /* Case and accents folded away, plus a map from each folded character back
     to where it started in the original. Stripping diacritics changes length
     ("café" is five code points decomposed, four folded), so without the map
     the highlight ranges would land off by however many accents preceded them.
     for..of walks code points, so an emoji in a name stays in one piece. */
  function foldWithMap(s) {
    let text = "";
    const map = [];
    let i = 0;
    for (const ch of s) {
      /* Greek writes a different sigma at the end of a word, so "ΟΔΟΣ" folds to
         οδοσ while someone typing it naturally in lower case produces οδος.
         Collapsing the two is a one-for-one swap, so the index map stays valid. */
      const folded = ch.normalize("NFD").replace(/\p{Diacritic}/gu, "")
                       .toLowerCase().replace(/ς/g, "σ");
      text += folded;
      /* One entry per UTF-16 code unit, because indexOf() below returns code
         unit offsets. Walking `folded` with for..of instead would push a single
         entry for an emoji that occupies two units, and every index after the
         first emoji in a name would be off by one. */
      for (let k = 0; k < folded.length; k++) map.push(i);
      i += ch.length;
    }
    map.push(s.length);   /* sentinel, so a match running to the end maps back */
    return { text, map };
  }

  /* Deliberately routed through the same per-character path as the names, so
     the two folds cannot disagree. Lowercasing a whole string maps a trailing
     Σ to final sigma ς while the per-character fold gives σ, which would leave
     an item called "ΟΔΟΣ" unable to match the word "ΟΔΟΣ". */
  function foldQuery(s) {
    return foldWithMap(s).text;
  }

  const segmenter = (typeof Intl !== "undefined" && Intl.Segmenter)
    ? new Intl.Segmenter(undefined, { granularity: "grapheme" })
    : null;

  /* For each index of the original name, the bounds of the grapheme cluster it
     belongs to. Highlight ranges are snapped out to these, so a <mark> never
     lands inside a ZWJ emoji, a flag, or a skin-tone modifier - splitting one
     makes it render as its component parts, and the row visibly jumps. It also
     makes a zero-width range impossible, which a fold that expands one
     character into two units can otherwise produce. */
  function clusterBounds(s) {
    const startOf = new Array(s.length + 1);
    const endOf = new Array(s.length + 1);
    if (segmenter) {
      for (const seg of segmenter.segment(s)) {
        const a = seg.index, b = a + seg.segment.length;
        for (let i = a; i < b; i++) { startOf[i] = a; endOf[i] = b; }
      }
    } else {
      /* No Intl.Segmenter: fall back to code point edges, which at least keeps
         surrogate pairs intact. */
      let i = 0;
      for (const ch of s) {
        for (let k = 0; k < ch.length; k++) { startOf[i + k] = i; endOf[i + k] = i + ch.length; }
        i += ch.length;
      }
    }
    startOf[s.length] = s.length;
    endOf[s.length] = s.length;
    return { startOf, endOf };
  }

  /* Every token must appear somewhere in the name, in any order - "bar protein"
     finds "Ready Protein Bar", which a plain substring test would miss.
     Returns the ranges to highlight, or null when the row does not match. */
  function matchRanges(rec, tokens) {
    const ranges = [];
    for (const token of tokens) {
      let from = 0, found = false;
      for (;;) {
        const at = rec.folded.indexOf(token, from);
        if (at === -1) break;
        found = true;
        const a = rec.map[at];
        const b = rec.map[at + token.length];
        /* Snapped outward to cluster edges; see clusterBounds. Using b - 1
           reads the cluster containing the last character *inside* the match
           rather than the one after it, and max() keeps that valid when the
           fold made the range empty. */
        ranges.push([rec.startOf[a], rec.endOf[Math.max(a, b - 1)]]);
        from = at + token.length;
      }
      if (!found) return null;
    }
    return mergeRanges(ranges);
  }

  /* Overlapping tokens ("pro" and "protein") would otherwise nest <mark>s. */
  function mergeRanges(ranges) {
    ranges.sort((a, b) => a[0] - b[0]);
    const out = [];
    ranges.forEach(r => {
      const last = out[out.length - 1];
      if (last && r[0] <= last[1]) last[1] = Math.max(last[1], r[1]);
      else out.push([r[0], r[1]]);
    });
    return out;
  }

  /* Built from text nodes. Never innerHTML: item names are free text typed
     into the editor, and the whole page is careful never to parse them as
     HTML. A highlighter is exactly where that guarantee gets lost. */
  function paintName(rec, ranges) {
    const node = rec.nameEl;
    if (!ranges || ranges.length === 0) {
      if (node.firstElementChild || node.textContent !== rec.original) {
        node.textContent = rec.original;
      }
      return;
    }
    node.replaceChildren();
    let at = 0;
    ranges.forEach(([start, end]) => {
      if (start > at) node.appendChild(document.createTextNode(rec.original.slice(at, start)));
      const m = document.createElement("mark");
      m.textContent = rec.original.slice(start, end);
      node.appendChild(m);
      at = end;
    });
    if (at < rec.original.length) {
      node.appendChild(document.createTextNode(rec.original.slice(at)));
    }
  }

  function applyFilter() {
    const raw = searchInput.value.trim();
    const tokens = foldQuery(raw).split(/\s+/).filter(Boolean);
    const searching = tokens.length > 0;

    const perSection = new Map();
    let shown = 0;

    searchIndex.forEach(rec => {
      const ranges = searching ? matchRanges(rec, tokens) : null;
      const hit = !searching || ranges !== null;
      rec.row.hidden = !hit;
      if (hit) shown++;
      perSection.set(rec.section, (perSection.get(rec.section) || 0) + (hit ? 1 : 0));
      paintName(rec, hit ? ranges : null);
    });

    /* A heading with nothing under it reads as a bug. */
    perSection.forEach((count, section) => { section.hidden = count === 0; });

    menuEl.classList.toggle("searching", searching);

    /* Tracks the raw value, not the trimmed one: a field holding only spaces
       still needs a way to empty it. */
    searchClear.hidden = searchInput.value === "";
    noResults.hidden = !(searching && shown === 0);
    if (!noResults.hidden) noResultsQ.textContent = "“" + raw + "”";

    if (!searching) setStatus("", true);
    else if (shown === 0) setStatus("No matches");
    else setStatus(shown + " of " + searchIndex.length + " items");
  }

  /* The visible count changes immediately - it is feedback on the keystroke
     just made. Only the spoken one waits, because a live region updated per
     character queues one announcement per character, and "monster" would be
     read out seven times. Clearing announces at once, since that follows a
     deliberate action rather than typing. */
  let statusTimer = 0;
  function setStatus(text, now) {
    searchStatus.textContent = text;
    clearTimeout(statusTimer);
    if (now) { searchAnnounce.textContent = text; return; }
    statusTimer = setTimeout(() => { searchAnnounce.textContent = text; }, 250);
  }

  /* No debounce, deliberately. The list is tens of rows, so a pass is far
     inside one frame; a delay would only add lag to something already
     instant, and make the results feel like they lag the typing. */
  searchInput.addEventListener("input", applyFilter);
  searchInput.addEventListener("search", applyFilter);  /* Esc / native clear */
  searchInput.addEventListener("keydown", e => {
    if (e.key === "Escape" && searchInput.value !== "") {
      e.preventDefault();
      searchInput.value = "";
      applyFilter();
    }
  });
  searchClear.addEventListener("click", () => {
    searchInput.value = "";
    /* Focus moves before the filter runs, because applyFilter hides this very
       button - blurring it first would close the on-screen keyboard, which
       then bounces the pay bar through a hide and show. */
    searchInput.focus();
    applyFilter();
  });

  function updateTotals() {
    const total = state.reduce((s, it) => s + it.qty * it.price, 0);
    const count = state.reduce((s, it) => s + it.qty, 0);

    totalEl.textContent = money(total);
    countEl.textContent = count;
    countLabelEl.textContent = count === 1 ? "item" : "items";

    /* Which buttons exist depends only on the menu; whether they work
       depends on the cart. */
    payBtn.hidden = !venmoUsername;
    altBtns.paypal.hidden = !paypalHandle;
    altBtns.cashapp.hidden = !cashtag;
    altBtns.zelle.hidden = !zelleTo;
    altRow.hidden = !(paypalHandle || cashtag || zelleTo);
    altRow.classList.toggle("only", !venmoUsername);

    const empty = total <= 0;
    payBtn.classList.toggle("disabled", empty);
    Object.values(altBtns).forEach(b => {
      b.classList.toggle("disabled", empty);
      b.disabled = empty;
    });
    if (empty) {
      payBtn.removeAttribute("href");
      venmoAppHref = "";
      return;
    }

    /* Both Venmo links carry the same three fields and differ only in shape.
       The query is built by hand rather than with URLSearchParams, which
       encodes spaces as "+" - Venmo shows the note verbatim, plus signs and
       all. encodeURIComponent uses %20, which Venmo renders as a space. */
    const user   = encodeURIComponent(venmoUsername);
    const amount = encodeURIComponent(total.toFixed(2));
    const note   = encodeURIComponent(buildNote());

    payBtn.href = `https://venmo.com/${user}?txn=pay&amount=${amount}&note=${note}`;
    /* The app's own scheme takes the recipient as a parameter instead of a
       path segment, and pays through /paycharge rather than the profile. */
    venmoAppHref = `venmo://paycharge?txn=pay&recipients=${user}&amount=${amount}&note=${note}`;
  }

  /* On a phone the web link above is only the fallback. Tapping venmo.com there
     does not go to Venmo directly: it loads Venmo's page, which rebuilds the
     query as form-encoded data on its way into the app, and form encoding
     writes a space as "+". The app then prints the note exactly as handed to
     it, plus signs and all - which is why the note reads correctly in a browser
     and arrives mangled on a phone. Handing the app its own scheme skips that
     rebuild, so the %20s survive as spaces.

     The href stays the web link so that a phone without Venmo installed still
     has somewhere to go, and so long-press-to-copy still yields a URL that
     means something. */
  payBtn.addEventListener("click", (e) => {
    if (!isPhone || !venmoAppHref || payBtn.classList.contains("disabled")) return;
    e.preventDefault();

    const webHref = payBtn.href;
    /* Opening the app backgrounds this page, and that is the only signal we get
       that it worked. Still visible a moment later means no app answered. */
    const giveUp = setTimeout(() => {
      if (!document.hidden) window.location.href = webHref;
    }, 1200);
    document.addEventListener("visibilitychange", function hidden() {
      if (!document.hidden) return;
      clearTimeout(giveUp);
      document.removeEventListener("visibilitychange", hidden);
    });

    window.location.href = venmoAppHref;
  });

  /* ---------------- PayPal, Cash App and Zelle ------------------------

     Venmo is the only one of the four whose link carries the itemized note:
       - PayPal.me takes an amount in the path and has no note field at all.
         On a phone the PayPal app also drops that amount (see the README).
       - Cash App takes an amount in the path; there is no note parameter.
       - Zelle has no payment link. It lives inside each bank's own app.
     So these three copy the note to the clipboard on the tap that opens the
     sheet - the tap is what lets a page write to the clipboard - and the
     sheet lays out everything needed to finish, each with its own Copy. */

  const sheet      = document.getElementById("paySheet");
  const sheetGo    = document.getElementById("sheetGo");
  const sheetClose = document.getElementById("sheetClose");
  const sheetHelp  = document.getElementById("sheetHelp");
  let sheetValues = { to: "", amt: "", note: "" };

  const METHODS = {
    paypal: {
      title: "Pay with PayPal",
      to: () => "paypal.me/" + paypalHandle,
      /* No currency suffix: paypal.me/handle/5.00USD is valid, but the app
         treats it as unparseable and drops the amount entirely. */
      href: total => `https://paypal.me/${encodeURIComponent(paypalHandle)}/${total.toFixed(2)}`,
      go: "Open PayPal",
      help: (amt, copied) => `${copied ? "The note is copied. Paste" : "Copy the note and paste"} it into PayPal's note field. If the amount is blank when PayPal opens, enter ${amt}.`,
    },
    cashapp: {
      title: "Pay with Cash App",
      to: () => "$" + cashtag,
      href: total => `https://cash.app/$${encodeURIComponent(cashtag)}/${total.toFixed(2)}`,
      go: "Open Cash App",
      help: (amt, copied) => `${copied ? "The note is copied. Paste" : "Copy the note and paste"} it into the "For" field in Cash App, and check the amount is ${amt}.`,
    },
    zelle: {
      title: "Pay with Zelle",
      to: () => zelleTo,
      href: null,
      help: (amt, copied) => `Open your bank's app, choose Zelle, and send ${amt} to the address above. ${copied ? "The note is copied; paste" : "Copy the note and paste"} it into the memo.`,
    },
  };

  /* The async Clipboard API needs a secure context and a recent tap; the
     textarea route covers older browsers. Returns whether it worked, so the
     sheet never claims a copy that did not happen. */
  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;";
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch { ok = false; }
      ta.remove();
      return ok;
    }
  }

  function markCopied(btn, ok) {
    clearTimeout(btn._t);
    btn.textContent = ok ? "Copied" : "Copy";
    btn.classList.toggle("done", ok);
    if (ok) btn._t = setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("done"); }, 2500);
  }

  async function openSheet(key) {
    const m = METHODS[key];
    const total = state.reduce((s, it) => s + it.qty * it.price, 0);
    if (!m || total <= 0) return;

    const note = buildNote();
    sheetValues = { to: m.to(), amt: total.toFixed(2), note };
    /* Started before anything else so it is still inside the tap. */
    const copying = copyText(note);

    document.getElementById("sheetTitle").textContent = m.title;
    document.getElementById("sheetTo").textContent = sheetValues.to;
    document.getElementById("sheetAmt").textContent = money(total);
    document.getElementById("sheetNote").textContent = note;
    sheet.querySelectorAll(".copy").forEach(b => markCopied(b, false));

    if (m.href) {
      sheetGo.hidden = false;
      sheetGo.href = m.href(total);
      sheetGo.textContent = m.go;
      sheetClose.textContent = "Cancel";
    } else {
      sheetGo.hidden = true;
      sheetGo.removeAttribute("href");
      sheetClose.textContent = "Done";
    }
    sheetHelp.textContent = m.help(money(total), false);
    if (!sheet.open) sheet.showModal();
    (m.href ? sheetGo : sheetClose).focus();

    const ok = await copying;
    sheetHelp.textContent = m.help(money(total), ok);
    markCopied(sheet.querySelector('[data-copy="note"]'), ok);
  }

  Object.entries(altBtns).forEach(([key, btn]) => {
    btn.addEventListener("click", () => openSheet(key));
  });
  sheet.querySelectorAll(".copy").forEach(btn => {
    btn.addEventListener("click", async () => {
      markCopied(btn, await copyText(sheetValues[btn.dataset.copy] || ""));
    });
  });
  sheetClose.addEventListener("click", () => sheet.close());
  /* A tap on the dimmed backdrop lands on the dialog element itself. */
  sheet.addEventListener("click", e => { if (e.target === sheet) sheet.close(); });

  /* Reads like a sentence rather than a receipt dump: the "1x" is dropped for
     single items and the last one is joined with "and". */
  function buildNote() {
    const parts = state.filter(it => it.qty > 0)
                       .map(it => (it.qty > 1 ? it.qty + "x " : "") + it.name);

    let list;
    if (parts.length === 1)      list = parts[0];
    else if (parts.length === 2) list = parts[0] + " and " + parts[1];
    else                         list = parts.slice(0, -1).join(", ") + ", and " + parts[parts.length - 1];

    const note = standName ? `${standName}: ${list}` : list;
    /* Venmo caps the note at 280 characters and silently drops the rest. */
    return note.length > 280 ? note.slice(0, 277) + "..." : note;
  }

  async function load() {
    showState("Loading menu…", null, false);
    try {
      /* Cache-busted: GitHub Pages sits behind a CDN, and without this a price
         change can take several minutes to show up. */
      const res = await fetch(`menu.json?v=${Date.now()}`, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const menu = await res.json();
      if (!menu || !Array.isArray(menu.categories)) throw new Error("Malformed menu");
      render(menu);
    } catch (err) {
      showState(
        "Couldn't load the menu.",
        "Check your connection and try again. (" + err.message + ")",
        true
      );
    }
  }

  /* The bar is fixed, so the list needs clearance under it or the last rows
     sit behind the buttons - close enough to look tappable, but the tap lands
     on the bar. The height is not a constant: it changes when the PayPal
     button appears, when the webfont finishes loading, and on rotation. So
     measure the bar and follow it rather than hard-coding a number that was
     already wrong once. */
  const barEl = document.querySelector(".bar");
  const wrapEl = document.querySelector(".wrap");
  let lastBarH = 0;
  function syncBarClearance() {
    /* Unreachable today - the keyboard hide below uses visibility precisely so
       the bar keeps its box and stays measurable. Kept because the day someone
       switches that to display:none, this is what stops the clearance under the
       list collapsing and yanking the page out from under a thumb. */
    const h = barEl.offsetHeight || lastBarH;
    if (h) lastBarH = h;
    wrapEl.style.paddingBottom = (h + 28) + "px";
    /* Also drives scroll-margin-bottom on the rows, so tabbing to a control
       near the end of the list does not park it underneath the bar. */
    document.documentElement.style.setProperty("--bar-h", h + "px");
  }
  if (window.ResizeObserver) {
    new ResizeObserver(syncBarClearance).observe(barEl);
  } else {
    window.addEventListener("resize", syncBarClearance);
    window.addEventListener("orientationchange", syncBarClearance);
  }
  syncBarClearance();

  /* Focusing the search field opens the on-screen keyboard, which shrinks the
     *visual* viewport but leaves the layout viewport alone - so a fixed bottom
     bar stays pinned to the bottom of the layout viewport and can end up drawn
     over the keys. It is taken away while the keyboard is up.

     Note this does mean the running total is not on screen while someone is
     typing, and people do add items mid-search. The stepper still answers
     that: the row turns blue and its own count changes on every tap. The
     total is back the moment the keyboard closes. Worth confirming on a real
     phone - if the bar turns out to be occluded by the keyboard anyway, this
     whole block is doing nothing and can go.

     visibility rather than display: the bar keeps its layout box, so
     offsetHeight above stays truthful, the clearance padding does not
     collapse, and the ResizeObserver never fires on the hide.

     Do not add `interactive-widget=resizes-content` to the viewport meta -
     it shrinks window.innerHeight in step with visualViewport.height, which
     zeroes the gap this depends on and would quietly disable it on Android. */
  const vv = window.visualViewport;
  if (vv) {
    /* 150px sits above the other things that shrink the visual viewport - the
       collapsing URL bar (~60-90px) and iOS's input accessory bar (~44px) -
       and below the shortest real keyboard (~160px, iPhone landscape). */
    const KEYBOARD_MIN = 150;
    const syncKeyboard = () => {
      /* scale guards against a pinch-zoom, which also shrinks vv.height. */
      const open = vv.scale <= 1.05 && (window.innerHeight - vv.height) > KEYBOARD_MIN;
      barEl.classList.toggle("kb-hidden", open);
    };
    vv.addEventListener("resize", syncKeyboard);
    /* iOS pans the visual viewport to keep the focused field in sight, which
       can cross the threshold without a resize. */
    vv.addEventListener("scroll", syncKeyboard);
    syncKeyboard();
  }

  load();
</script>
</body>
</html>
